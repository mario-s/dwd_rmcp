<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DWD · Wetter jetzt</title>
  <!--DWD:SHARED-->
  <style>
    :root {
      --sun: #f2a900;
      --storm: #7c5cd6;
      --lime-ink: #3f7d14;
      --hero-a: #eaf0fd;
      --hero-b: #f7f9ff;
    }
    :root[data-theme="dark"] {
      --sun: #ffc94a;
      --storm: #b39bff;
      --lime-ink: #a8e070;
      --hero-a: rgba(126, 162, 255, 0.16);
      --hero-b: rgba(126, 162, 255, 0.04);
    }

    #app { container-type: inline-size; }

    .ic-sun { color: var(--sun); }
    .ic-moon { color: var(--ink-2); }
    .ic-cloud, .ic-partly, .ic-fog { color: var(--accent); }
    .ic-rain, .ic-drizzle, .ic-showers { color: var(--rain); }
    .ic-thunder { color: var(--storm); }
    .ic-snow, .ic-sleet { color: var(--dew); }
    .ic-none { color: var(--ink-3); opacity: .6; }

    /* header */
    .hd { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .hd .txt { min-width: 0; flex: 1; }
    .hd .dwd-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .live {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px; border-radius: 999px;
      background: var(--dwd-lime-soft); color: var(--lime-ink);
      font-size: 12px; font-weight: 650; white-space: nowrap;
    }
    .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--dwd-lime); box-shadow: 0 0 0 3px rgba(143, 209, 79, .25); }

    /* main grid */
    .main { display: grid; gap: 12px; grid-template-columns: 1fr; }
    @container (min-width: 560px) {
      .main { grid-template-columns: minmax(0, 1fr) minmax(0, 1.12fr); gap: 14px; }
    }

    .hero {
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--hero-a), var(--hero-b));
      border: 1px solid var(--line);
      padding: 14px 16px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
    }
    .hero-top { display: flex; align-items: center; gap: 14px; }
    .hero-ic {
      width: 72px; height: 72px; flex: none; display: grid; place-items: center;
      border-radius: 20px; background: var(--card); box-shadow: var(--shadow);
    }
    .hero-ic svg { stroke-width: 1.35; }
    .temp { font-variant-numeric: proportional-nums; font-size: 52px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; color: var(--ink); }
    .temp sup { font-size: 24px; font-weight: 600; vertical-align: top; position: relative; top: 4px; margin-left: 2px; color: var(--ink-2); }
    .cond { font-size: 15px; font-weight: 650; margin-top: 6px; }
    .cond-sub { font-size: 12px; color: var(--ink-3); margin-top: 1px; }

    .today { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
    .today .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
    .today .val { font-size: 14px; font-weight: 650; margin-top: 3px; white-space: nowrap; }
    .range { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 14px; font-weight: 650; }
    .range .bar { flex: 1; min-width: 22px; height: 5px; border-radius: 99px; background: linear-gradient(90deg, var(--rain), var(--temp)); }
    .range .lo { color: var(--rain); }
    .range .hi { color: var(--temp); }

    /* KPI tiles */
    .kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-content: stretch; }
    .kpi {
      display: flex; align-items: center; gap: 8px;
      background: var(--card-2); border: 1px solid var(--line); border-radius: 12px;
      padding: 10px 9px; min-width: 0;
    }
    .kpi .sq {
      width: 32px; height: 32px; border-radius: 10px; flex: none; display: grid; place-items: center;
      background: var(--dwd-lime-soft); color: var(--lime-ink);
    }
    .kpi .tx { min-width: 0; }
    .kpi .v { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; white-space: nowrap; }
    .kpi .v small { font-size: 12px; font-weight: 600; color: var(--ink-3); margin-left: 3px; }
    .kpi .lbl { font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .arrow { transition: transform .3s ease; }

    /* next hours */
    .next { margin-top: 14px; }
    .sec-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .hours { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
    .h {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      padding: 9px 2px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
      min-width: 0;
    }
    .h.wet { background: linear-gradient(180deg, var(--card), var(--rain-soft)); }
    .h .t { font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
    .h .tt { font-size: 15px; font-weight: 700; }
    .h .p { font-size: 11px; font-weight: 650; color: var(--rain); white-space: nowrap; }
    .h .p.dry { color: var(--ink-3); font-weight: 500; }

    /* footer */
    .ft-l { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .ft-l span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dwd-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .dwd-btn.primary:hover { filter: brightness(1.08); color: #fff; }
    :root[data-theme="dark"] .dwd-btn.primary { color: #0f141f; }
    .dwd-footer .dwd-btn { white-space: nowrap; }
    .dwd-btn[disabled] { opacity: .7; cursor: default; }

    @container (min-width: 441px) and (max-width: 559px) {
      .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @container (max-width: 440px) {
      .hd { margin-bottom: 12px; }
      .hero { padding: 12px 14px; gap: 10px; }
      .temp { font-size: 44px; }
      .temp sup { font-size: 20px; }
      .cond { font-size: 14px; margin-top: 4px; }
      .hero-ic { width: 58px; height: 58px; border-radius: 17px; }
      .hero-ic svg { width: 42px; height: 42px; }
      .today { padding-top: 10px; }
      .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
      .kpi {
        display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "v v" "sq lbl";
        column-gap: 4px; row-gap: 2px; align-items: center; padding: 8px 9px;
      }
      .kpi .tx { display: contents; }
      .kpi .v { grid-area: v; font-size: 15px; }
      .kpi .v small { font-size: 11px; margin-left: 2px; }
      .kpi .lbl { grid-area: lbl; font-size: 10.5px; margin: 0; }
      .kpi .sq { grid-area: sq; width: 14px; height: 14px; background: none; border-radius: 0; }
      .kpi .sq svg { width: 14px; height: 14px; }
      .next { margin-top: 12px; }
      .hours { gap: 4px; }
      .h { padding: 7px 1px 6px; gap: 3px; border-radius: 10px; }
      .h svg { width: 22px; height: 22px; }
      .h .t { font-size: 11px; }
      .h .tt { font-size: 14px; }
      .h .p { font-size: 10px; }
      .sec-h .dwd-sub { display: none; }
      .dwd-footer .dwd-btn { padding: 8px 11px; }
      .ft-l .run { display: none; }
      .kpi .long { display: none; }
    }
  </style>
</head>
<body>
  <div class="dwd-card">
    <div class="dwd-skeleton">Lade DWD-Daten …</div>
    <div class="dwd-content" id="app"></div>
  </div>
  <script>
  (function () {
    "use strict";
    const F = DWD.fmt;
    const esc = F.esc;
    const isNum = (v) => typeof v === "number" && isFinite(v);
    const app = document.getElementById("app");

    function wxIcon(code, iso, size) {
      const info = F.ww(code, iso);
      const name = info.icon;
      if (!isNum(code)) return { html: '<span class="ic-none">' + DWD.icon("thermo", size) + "</span>", label: "" };
      return { html: '<span class="ic-' + name + '">' + DWD.icon(name, size) + "</span>", label: info.label };
    }

    function coord(v, pos, neg) {
      return isNum(v) ? F.num(Math.abs(v), 2) + "° " + (v >= 0 ? pos : neg) : "–";
    }

    function arrowSvg(deg, size) {
      // meteorological "from" direction → arrow points where the wind blows to
      const rot = isNum(deg) ? deg + 180 : 0;
      return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" aria-hidden="true" style="' + (isNum(deg) ? "" : "opacity:.35") + '">' +
        '<g class="arrow" style="transform:rotate(' + rot + 'deg);transform-origin:12px 12px">' +
        '<path d="M12 3.5l5 7.5h-3.4v9.5h-3.2V11H7z" fill="currentColor"/></g></svg>';
    }

    function modelName(m) {
      const id = m && m.collection_id ? String(m.collection_id).split("@")[0] : "DWD-Modell";
      return id;
    }

    function kpi(icon, label, value, unit) {
      return '<div class="kpi"><span class="sq">' + icon + '</span><div class="tx">' +
        '<div class="v">' + value + (unit ? "<small>" + unit + "</small>" : "") + '</div><div class="lbl">' + label + "</div></div></div>";
    }

    function numOr(v, d) { return isNum(v) ? F.num(v, d) : "–"; }

    function render(data) {
      const loc = data.location || {};
      const steps = Array.isArray(data.next) ? data.next.filter(Boolean) : [];
      const now = data.now || steps[0] || {};
      const today = data.today || {};
      const placeName = loc.name ? String(loc.name) : null;
      const coords = coord(loc.lat, "N", "S") + " · " + coord(loc.lon, "O", "W");
      const w = wxIcon(now.ww, now.time, 52);
      const model = modelName(data.model);
      const runIso = data.model && (data.model.reference_time || data.model.instance_id);

      const t = isNum(now.t2m_c) ? F.num(now.t2m_c, 0) : "–";
      const dir = F.windDir(now.wind_dir_deg);
      const bft = F.beaufort(now.wind_speed_kmh);

      const hoursHtml = steps.slice(0, 6).map((s) => {
        const ic = wxIcon(s.ww, s.time, 26);
        // WW >= 50 = drizzle/rain/snow/showers/thunder; tiny model amounts would otherwise round to "0,0 mm"
        const wetCode = isNum(s.ww) && s.ww >= 50;
        const wet = isNum(s.precip_mm) && s.precip_mm >= 0.05;
        const trace = !wet && wetCode && (!isNum(s.precip_mm) || s.precip_mm < 0.05);
        const p = wet ? F.mm(s.precip_mm)
          : trace ? "< 0,1 mm"
          : isNum(s.precip_mm) ? '<span class="p dry">0 mm</span>' : '<span class="p dry">–</span>';
        return '<div class="h' + (wet || trace ? " wet" : "") + '" title="' + esc(ic.label) + '">' +
          '<span class="t">' + esc(F.time(s.time)) + "</span>" + ic.html +
          '<span class="tt">' + esc(F.temp(s.t2m_c)) + "</span>" +
          (wet || trace ? '<span class="p">' + esc(p) + "</span>" : p) + "</div>";
      }).join("");

      const gustTime = today.gust_max_time ? " · " + F.time(today.gust_max_time) : "";

      app.innerHTML =
        '<div class="hd">' +
          '<span class="dwd-badge-icon">' + DWD.icon("pin", 18) + "</span>" +
          '<div class="txt"><div class="dwd-title">' + esc(placeName || "Ausgewählter Ort") + "</div>" +
          '<div class="dwd-sub">' + esc(coords) + "</div></div>" +
          '<span class="live"><i></i>Jetzt · ' + esc(F.time(now.time)) + "</span>" +
        "</div>" +

        '<div class="main">' +
          '<section class="hero" aria-label="Aktuelles Wetter">' +
            '<div class="hero-top">' +
              '<div class="hero-ic">' + w.html + "</div>" +
              "<div>" +
                '<div class="temp">' + esc(t) + (t !== "–" ? "<sup>°C</sup>" : "") + "</div>" +
                (w.label ? '<div class="cond">' + esc(w.label) + "</div>" : "") +
                '<div class="cond-sub">' + esc(F.dateTime(now.time)) + " Uhr</div>" +
              "</div>" +
            "</div>" +
            '<div class="today">' +
              '<div><div class="lbl">Heute</div><div class="range"><span class="lo">' + esc(F.temp(today.t_min_c)) +
                '</span><span class="bar"></span><span class="hi">' + esc(F.temp(today.t_max_c)) + "</span></div></div>" +
              '<div><div class="lbl">Σ Regen</div><div class="val">' + esc(F.mm(today.precip_sum_mm)) + "</div></div>" +
              '<div><div class="lbl">Max. Böe</div><div class="val" title="' + esc(F.kmh(today.gust_max_kmh) + gustTime) + '">' + esc(F.kmh(today.gust_max_kmh)) + "</div></div>" +
            "</div>" +
          "</section>" +

          '<section class="kpis" aria-label="Messgrößen">' +
            kpi('<span style="color:var(--wind)">' + arrowSvg(now.wind_dir_deg, 20) + "</span>", (dir !== "–" ? "Wind " + esc(dir) : "Wind") + (bft != null ? '<span class="long"> · Bft ' + bft + "</span>" : ""), esc(numOr(now.wind_speed_kmh, 0)), "km/h") +
            kpi(DWD.icon("wind", 18), "Böen", esc(numOr(now.gust_kmh, 0)), "km/h") +
            kpi(DWD.icon("drop", 18), "Regen/h", esc(isNum(now.precip_mm) && now.precip_mm > 0 && now.precip_mm < 0.05 ? "< 0,1" : numOr(now.precip_mm, 1)), "mm") +
            kpi(DWD.icon("cloud", 18), "Bewölkung", esc(numOr(now.cloud_pct, 0)), "%") +
            kpi(DWD.icon("gauge", 18), "Luftdruck", esc(numOr(now.pmsl_hpa, 0)), "hPa") +
            kpi(DWD.icon("thermo", 18), "Taupunkt", esc(F.temp(now.td2m_c, 1)), "") +
          "</section>" +
        "</div>" +

        (hoursHtml
          ? '<section class="next" aria-label="Nächste Stunden"><div class="sec-h"><span class="dwd-eyebrow">Nächste Stunden</span>' +
            '<span class="dwd-sub">Niederschlag je Stunde</span></div><div class="hours" style="grid-template-columns:repeat(' + Math.max(3, Math.min(6, steps.length)) + ',minmax(0,1fr))">' + hoursHtml + "</div></section>"
          : "") +

        '<div class="dwd-footer">' +
          '<div class="ft-l"><span class="dwd-logo">DWD</span><span>' + esc(model) + (runIso ? '<span class="run"> · Lauf ' + esc(F.time(runIso)) + "</span>" : "") + "</span></div>" +
          '<button class="dwd-btn primary" id="more" type="button">' + DWD.icon("layers", 14) + "Stündliche Vorhersage</button>" +
        "</div>";

      const btn = document.getElementById("more");
      btn.addEventListener("click", () => {
        const where = placeName || (isNum(loc.lat) && isNum(loc.lon) ? F.num(loc.lat, 3) + ", " + F.num(loc.lon, 3) : "diesen Ort");
        btn.disabled = true;
        const reset = () => setTimeout(() => { btn.disabled = false; }, 1500);
        Promise.resolve()
          .then(() => DWD.sendMessage("Zeig mir die stündliche Vorhersage für " + where + " als Diagramm"))
          .then(reset, (e) => { console.warn("[dwd] sendMessage", e && e.message); reset(); });
      });
      DWD.resize();
    }

    DWD.onData((data) => {
      try { render(data || {}); }
      catch (e) {
        app.innerHTML = '<div class="dwd-error">Darstellung fehlgeschlagen: ' + esc(e && e.message) + "</div>";
        console.warn(e);
      }
    });
  })();
  </script>
</body>
</html>
