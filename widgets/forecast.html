<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DWD · Meteogramm</title>
  <!--DWD:SHARED-->
  <style>
    :root {
      --sun: #f2a900;
      --storm: #7c5cd6;
      --lime-ink: #3f7d14;
      --now: #6fb83a;
      --past: rgba(20, 33, 61, 0.035);
      --tip-bg: rgba(255, 255, 255, 0.97);
    }
    :root[data-theme="dark"] {
      --sun: #ffc94a;
      --storm: #b39bff;
      --lime-ink: #a8e070;
      --now: #8fd14f;
      --past: rgba(255, 255, 255, 0.035);
      --tip-bg: rgba(29, 37, 55, 0.97);
    }
    #app { container-type: inline-size; }

    .ic-sun { color: var(--sun); }
    .ic-moon { color: var(--ink-2); }
    .ic-cloud, .ic-partly, .ic-fog { color: var(--accent); }
    .ic-rain, .ic-drizzle, .ic-showers { color: var(--rain); }
    .ic-thunder { color: var(--storm); }
    .ic-snow, .ic-sleet { color: var(--dew); }

    /* header */
    .dwd-card { padding: 14px 16px; }
    .dwd-footer { margin-top: 8px; padding-top: 8px; }
    .hd { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .hd .ttl { display: flex; align-items: center; gap: 10px; flex: 1 1 220px; min-width: 0; }
    .hd .txt { min-width: 0; }
    .hd .dwd-title, .hd .dwd-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dwd-seg button { display: inline-flex; align-items: center; gap: 5px; }
    .dwd-seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* KPI tiles */
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 6px; }
    .kpi {
      display: flex; align-items: center; gap: 9px; min-width: 0;
      background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px;
    }
    .kpi .sq {
      width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center;
      background: var(--dwd-lime-soft); color: var(--lime-ink);
    }
    .kpi .tx { min-width: 0; }
    .kpi .v { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; white-space: nowrap; font-variant-numeric: proportional-nums; }
    .kpi .v small { font-size: 11.5px; font-weight: 600; color: var(--ink-3); margin-left: 2px; }
    .kpi .lbl { font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* chart */
    .chart {
      position: relative; touch-action: pan-y; outline: none; border-radius: 10px;
      -webkit-user-select: none; user-select: none; cursor: crosshair;
    }
    .chart:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
    .chart svg { display: block; width: 100%; overflow: visible; }
    .empty { padding: 40px 0; text-align: center; color: var(--ink-3); font-size: 13px; }

    .grid { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
    .base { stroke: var(--ink-3); stroke-opacity: .45; stroke-width: 1; shape-rendering: crispEdges; }
    .daysep { stroke: var(--ink-3); stroke-opacity: .35; stroke-width: 1; shape-rendering: crispEdges; }
    .tick { fill: var(--ink-3); font-size: 10px; font-variant-numeric: tabular-nums; }
    .ptitle { fill: var(--ink-3); font-size: 9.5px; font-weight: 650; letter-spacing: .02em; }
    .daylbl { fill: var(--ink-2); font-size: 10.5px; font-weight: 650; }
    .gut { fill: var(--ink-3); font-size: 9px; font-weight: 600; letter-spacing: .02em; }
    .t-line { fill: none; stroke: var(--temp); stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
    .td-line { fill: none; stroke: var(--dew); stroke-width: 1.5; stroke-dasharray: 3 3; stroke-linecap: round; opacity: .9; }
    .t-stop { stop-color: var(--temp); }
    .bar { fill: var(--rain); }
    .bar.lite { opacity: .7; }
    .c-stop { stop-color: var(--cloud); }
    .c-track { fill: var(--card-2); stroke: var(--line); stroke-width: 1; }
    .w-line { fill: none; stroke: var(--wind); stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
    .g-line { fill: none; stroke: var(--gust); stroke-width: 1.25; stroke-dasharray: 3 3; opacity: .8; }
    .g-band { fill: var(--wind); opacity: .13; }
    .arrow { stroke: var(--wind); stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .arrow.strong { stroke: var(--gust); stroke-width: 2; }
    .wspd { fill: var(--ink-2); font-size: 9.5px; }
    .wspd.strong { fill: var(--ink); font-weight: 700; }
    .ann { fill: var(--ink); font-size: 10.5px; font-weight: 700; }
    .ann-halo { stroke: var(--card); stroke-width: 3px; paint-order: stroke; stroke-linejoin: round; }
    .dot { stroke: var(--card); stroke-width: 2; }
    .dot.t { fill: var(--temp); } .dot.td { fill: var(--dew); } .dot.w { fill: var(--wind); } .dot.g { fill: var(--gust); }
    .past { fill: var(--past); }
    .now-line { stroke: var(--now); stroke-width: 1.5; }
    .now-pill { fill: var(--now); }
    .now-txt { fill: #14213d; font-size: 9px; font-weight: 750; letter-spacing: .04em; }
    .hover-col { fill: var(--accent); opacity: .07; }
    .hover-line { stroke: var(--ink-2); stroke-width: 1; stroke-opacity: .55; shape-rendering: crispEdges; }
    .bar-val { fill: var(--ink-2); font-size: 9.5px; font-weight: 650; }
    .noprecip { fill: var(--ink-3); font-size: 10.5px; }
    .hit { fill: transparent; }

    /* tooltip */
    .tip {
      position: absolute; top: 0; left: 0; z-index: 2; pointer-events: none;
      min-width: 188px; padding: 9px 11px 8px; border-radius: 11px;
      background: var(--tip-bg); border: 1px solid var(--line); box-shadow: var(--shadow);
      font-size: 12px; color: var(--ink); opacity: 0; visibility: hidden;
      transition: opacity .12s ease;
    }
    .tip.on { opacity: 1; visibility: visible; }
    .tip .th { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
    .tip .tt { font-weight: 700; font-size: 12px; white-space: nowrap; }
    .tip .tw { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); font-size: 11.5px; white-space: nowrap; }
    .tip table { border-collapse: collapse; width: 100%; }
    .tip td { padding: 1.5px 0; white-space: nowrap; }
    .tip td:first-child { color: var(--ink-2); padding-right: 12px; }
    .tip td:last-child { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
    .tip td small { color: var(--ink-3); font-weight: 500; }
    .sw { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
    .sw.t { background: var(--temp); }
    .sw.td { background: repeating-linear-gradient(90deg, var(--dew) 0 3px, transparent 3px 5px); }
    .sw.p { background: var(--rain); height: 9px; width: 6px; border-radius: 2px 2px 0 0; margin: 0 8px 0 2px; }
    .sw.c { background: var(--cloud); height: 7px; opacity: .75; }
    .sw.w { background: var(--wind); }
    .sw.g { background: repeating-linear-gradient(90deg, var(--gust) 0 3px, transparent 3px 5px); }
    .sw.n { background: none; }

    /* legend row */
    .leg { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-top: 2px; font-size: 11.5px; color: var(--ink-2); }
    .leg span { white-space: nowrap; }
    .leg .hint { margin-left: auto; color: var(--ink-3); font-size: 11px; }

    .ft-l { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .ft-l > span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    @container (max-width: 520px) {
      .hd .dwd-seg { width: 100%; }
      .hd .dwd-seg button { flex: 1; justify-content: center; padding: 7px 6px; }
      .kpis { gap: 6px; }
      .kpi { flex-direction: column; align-items: flex-start; gap: 0; padding: 7px 8px; }
      .kpi .sq { display: none; }
      .kpi .v { font-size: 14.5px; }
      .kpi .v small { font-size: 10.5px; }
      .kpi .lbl { font-size: 10.5px; }
      .kpi .long { display: none; }
      .leg { gap: 3px 10px; font-size: 11px; }
      .leg .hint { display: none; }
      .ft-r { display: none; }
    }
  </style>
</head>
<body>
  <div class="dwd-card">
    <div class="dwd-skeleton">Lade DWD-Daten …</div>
    <div class="dwd-content" id="app"></div>
  </div>
  <script>
  (function () {
    "use strict";
    const F = DWD.fmt;
    const esc = F.esc;
    const isNum = (v) => typeof v === "number" && isFinite(v);
    const app = document.getElementById("app");
    const TZ = "Europe/Berlin";
    const hourFmt = new Intl.DateTimeFormat("de-DE", { hour: "numeric", hourCycle: "h23", timeZone: TZ });
    const dayKeyFmt = new Intl.DateTimeFormat("de-DE", { year: "numeric", month: "2-digit", day: "2-digit", timeZone: TZ });
    const r1 = (v) => Math.round(v * 10) / 10;

    const MODES = [
      { id: "temp", label: "Temperatur" },
      { id: "precip", label: "Niederschlag" },
      { id: "wind", label: "Wind" },
    ];
    const state = { data: null, steps: [], mode: "temp", idx: null, active: false, W: 0, geo: null };

    // ---------- helpers ----------
    function localHour(iso) {
      const part = hourFmt.formatToParts(new Date(iso)).find((x) => x.type === "hour");
      return part ? Number(part.value) % 24 : 0;
    }
    function dayKey(iso) { return dayKeyFmt.format(new Date(iso)); }

    function wx(code, iso) {
      const info = F.ww(code, iso);
      return { name: info.icon, label: info.label };
    }

    function vals(key) { return state.steps.map((s) => (isNum(s[key]) ? s[key] : null)); }
    function finite(arr) { return arr.filter(isNum); }

    function niceStep(range, target, allowQuarter) {
      const raw = Math.max(range, 1e-6) / Math.max(1, target);
      const p = Math.pow(10, Math.floor(Math.log10(raw)));
      const m = raw / p;
      return (m <= 1 ? 1 : m <= 2 ? 2 : allowQuarter && m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
    }

    // Monotone cubic (Fritsch–Carlson) path through points, split at nulls.
    function segments(xs, ys) {
      const out = []; let cur = [];
      ys.forEach((y, i) => { if (y == null) { if (cur.length) out.push(cur); cur = []; } else cur.push([xs[i], y, i]); });
      if (cur.length) out.push(cur);
      return out;
    }
    function monoPath(pts) {
      const n = pts.length;
      const f = (v) => v.toFixed(1);
      if (!n) return "";
      if (n === 1) return "M" + f(pts[0][0] - 1.5) + "," + f(pts[0][1]) + "h3";
      const dx = [], m = [], t = [];
      for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; m[i] = (pts[i + 1][1] - pts[i][1]) / dx[i]; }
      t[0] = m[0]; t[n - 1] = m[n - 2];
      for (let i = 1; i < n - 1; i++) {
        t[i] = m[i - 1] * m[i] <= 0 ? 0 : (3 * (dx[i - 1] + dx[i])) / ((2 * dx[i] + dx[i - 1]) / m[i - 1] + (dx[i] + 2 * dx[i - 1]) / m[i]);
      }
      let d = "M" + f(pts[0][0]) + "," + f(pts[0][1]);
      for (let i = 0; i < n - 1; i++) {
        const h = dx[i] / 3;
        d += "C" + f(pts[i][0] + h) + "," + f(pts[i][1] + h * t[i]) + " " +
          f(pts[i + 1][0] - h) + "," + f(pts[i + 1][1] - h * t[i + 1]) + " " + f(pts[i + 1][0]) + "," + f(pts[i + 1][1]);
      }
      return d;
    }
    function linePath(xs, ys) { return segments(xs, ys).map(monoPath).join(""); }
    function areaPath(xs, ys, base) {
      return segments(xs, ys).map((seg) => {
        const a = seg[0][0], b = seg[seg.length - 1][0];
        return monoPath(seg) + "L" + b.toFixed(1) + "," + base.toFixed(1) + "L" + a.toFixed(1) + "," + base.toFixed(1) + "Z";
      }).join("");
    }
    function bandPath(xs, lo, hi) {
      const ys = lo.map((v, i) => (v == null || hi[i] == null ? null : v));
      return segments(xs, ys).filter((seg) => seg.length > 1).map((seg) => {
        const top = seg.map((p) => [p[0], hi[p[2]]]);
        const bottom = seg.map((p) => [p[0], lo[p[2]]]).reverse();
        return monoPath(top) + monoPath(bottom).replace(/^M/, "L") + "Z";
      }).join("");
    }

    function iconAt(name, cx, cy, size) {
      const s = DWD.icon(name, size).replace('<svg class="dwd-icon"', '<svg x="' + (cx - size / 2).toFixed(1) + '" y="' + (cy - size / 2).toFixed(1) + '"');
      return '<g class="ic-' + name + '">' + s + "</g>";
    }

    function summaryOf(data, steps) {
      const s = Object.assign({}, data.summary || {});
      const t = finite(steps.map((x) => x.t2m_c));
      const p = finite(steps.map((x) => x.precip_mm));
      const c = finite(steps.map((x) => x.cloud_pct));
      if (!isNum(s.t_min_c) && t.length) s.t_min_c = Math.min(...t);
      if (!isNum(s.t_max_c) && t.length) s.t_max_c = Math.max(...t);
      if (!isNum(s.precip_sum_mm) && p.length) s.precip_sum_mm = r1(p.reduce((a, b) => a + b, 0));
      if (!isNum(s.cloud_mean_pct) && c.length) s.cloud_mean_pct = c.reduce((a, b) => a + b, 0) / c.length;
      if (!isNum(s.gust_max_kmh)) {
        let best = null;
        steps.forEach((x) => { if (isNum(x.gust_kmh) && (!best || x.gust_kmh > best.gust_kmh)) best = x; });
        if (best) { s.gust_max_kmh = best.gust_kmh; s.gust_max_time = best.time; }
      }
      return s;
    }

    // Fractional step index of "now" (falls back to generated_at so archived payloads still get a marker).
    function nowFraction() {
      const st = state.steps;
      if (!st.length) return null;
      const t0 = Date.parse(st[0].time);
      const span = st.length > 1 ? (Date.parse(st[st.length - 1].time) - t0) / (st.length - 1) : 3600e3;
      if (!(span > 0)) return null;
      const inRange = (ms) => { const f = (ms - t0) / span; return f >= -0.5 && f <= st.length - 0.5 ? f : null; };
      let f = inRange(Date.now());
      if (f == null && state.data && state.data.generated_at) f = inRange(Date.parse(state.data.generated_at));
      return f;
    }

    // ---------- shell ----------
    function render(data) {
      state.data = data;
      state.steps = (Array.isArray(data.steps) ? data.steps : []).filter((s) => s && s.time && !isNaN(Date.parse(s.time)));
      const steps = state.steps;
      const loc = data.location || {};
      const name = loc.name ? String(loc.name) : null;
      const sum = summaryOf(data, steps);
      const model = data.model && data.model.collection_id ? String(data.model.collection_id).split("@")[0] : "DWD-Modell";
      const runIso = data.model && (data.model.reference_time || data.model.instance_id);
      const first = steps[0], last = steps[steps.length - 1];
      const spanH = steps.length > 1 ? Math.round((Date.parse(last.time) - Date.parse(first.time)) / 3600e3) : 0;
      const range = steps.length
        ? F.dateTime(first.time) + " – " + (dayKey(first.time) === dayKey(last.time) ? F.time(last.time) : F.dateTime(last.time))
        : "Keine Zeitschritte";
      const coords = isNum(loc.lat) && isNum(loc.lon) ? F.num(loc.lat, 2) + "° N · " + F.num(loc.lon, 2) + "° O" : "";
      if (state.idx != null && state.idx >= steps.length) state.idx = null;

      const kpi = (icon, value, unit, label, title) =>
        '<div class="kpi"' + (title ? ' title="' + esc(title) + '"' : "") + '><span class="sq">' + DWD.icon(icon, 17) + '</span><div class="tx"><div class="v">' +
        value + (unit ? "<small>" + unit + "</small>" : "") + '</div><div class="lbl">' + label + "</div></div></div>";
      const n0 = (v) => (isNum(v) ? F.num(v, 0) : "–");

      app.innerHTML =
        '<div class="hd">' +
          '<div class="ttl"><span class="dwd-badge-icon">' + DWD.icon("layers", 18) + "</span>" +
          '<div class="txt"><div class="dwd-title">Meteogramm · ' + esc(name || coords || "Standort") + "</div>" +
          '<div class="dwd-sub">' + esc(range) + (spanH > 0 ? " · " + spanH + " Std." : "") + "</div></div></div>" +
          '<div class="dwd-seg" role="group" aria-label="Schwerpunkt">' +
            MODES.map((m) => '<button type="button" data-mode="' + m.id + '" aria-pressed="' + (state.mode === m.id) + '">' + esc(m.label) + "</button>").join("") +
          "</div>" +
        "</div>" +
        '<div class="kpis">' +
          kpi("thermo", isNum(sum.t_min_c) || isNum(sum.t_max_c) ? esc(n0(sum.t_min_c)) + "° / " + esc(n0(sum.t_max_c)) + "°" : "–", "", "Min / Max") +
          kpi("drop", esc(isNum(sum.precip_sum_mm) ? F.num(sum.precip_sum_mm, sum.precip_sum_mm < 10 ? 1 : 0) : "–"), "mm", "Niederschlag") +
          kpi("wind", esc(n0(sum.gust_max_kmh)), "km/h",
            "Spitzenböe",
            sum.gust_max_time ? "Spitzenböe " + F.dateTime(sum.gust_max_time) + " Uhr" : "") +
          kpi("cloud", esc(n0(sum.cloud_mean_pct)), "%", 'Bewölkung<span class="long"> Ø</span>') +
        "</div>" +
        (steps.length
          ? '<div class="chart" id="chart" tabindex="0" role="img" aria-label="Meteogramm: Temperatur, Niederschlag, Bewölkung und Wind je Stunde. Pfeiltasten wählen eine Stunde."><div class="tip" id="tip" aria-live="polite"></div></div>' +
            '<div class="leg" id="leg"></div>'
          : '<div class="empty">Für diesen Zeitraum liegen keine Vorhersagedaten vor.</div>') +
        '<div class="dwd-footer">' +
          '<div class="ft-l"><span class="dwd-logo">DWD</span><span>' + esc(model) + (runIso ? " · Lauf " + esc(F.time(runIso)) : "") + "</span></div>" +
          (data.generated_at ? '<span class="ft-r">Stand ' + esc(F.time(data.generated_at)) + " Uhr</span>" : "") +
        "</div>";

      app.querySelectorAll(".dwd-seg button").forEach((b) => b.addEventListener("click", () => {
        state.mode = b.dataset.mode;
        app.querySelectorAll(".dwd-seg button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        draw(true);
      }));

      const chart = document.getElementById("chart");
      if (chart) bindChart(chart);
      state.active = false;
      draw(true);
    }

    // ---------- chart ----------
    function layout(W) {
      const narrow = W < 460;
      const PL = 34, PR = 10;
      const mode = state.mode;
      const big = narrow ? 106 : 120, small = narrow ? 44 : 50, mid = narrow ? 52 : 56;
      const panels =
        mode === "precip" ? [["temp", mid], ["precip", big]]
        : mode === "wind" ? [["temp", mid], ["wind", big]]
        : [["temp", big], ["precip", small]];
      const plotTop = 72;
      let y = plotTop;
      const P = {};
      panels.forEach(([k, h], i) => { P[k] = { top: y, h, bot: y + h }; y += h + (i < panels.length - 1 ? 15 : 0); });
      const plotBot = y;
      return { W, PL, PR, narrow, P, plotTop, plotBot, axisY: plotBot + 14, arrowY: plotBot + 29, spdY: plotBot + 46, H: plotBot + 50 };
    }

    function draw(force) {
      const chart = document.getElementById("chart");
      if (!chart) { DWD.resize(); return; }
      const W = Math.round(chart.clientWidth);
      if (!W || (!force && W === state.W)) return;
      state.W = W;
      const g = layout(W);
      const st = state.steps, n = st.length;
      const cw = (W - g.PL - g.PR) / n;
      const X = (i) => g.PL + (i + 0.5) * cw;
      const xs = st.map((_, i) => X(i));
      g.cw = cw; g.X = X;
      const out = [];
      const mode = state.mode;
      const right = W - g.PR;

      const T = vals("t2m_c"), TD = vals("td2m_c"), PRC = vals("precip_mm"), C = vals("cloud_pct");
      const WS = vals("wind_speed_kmh"), GU = vals("gust_kmh"), WD = vals("wind_dir_deg");
      const pickStep = (cands, minPx) => cands.find((k) => k * cw >= minPx) || cands[cands.length - 1];

      out.push('<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="t-stop" stop-opacity=".26"/><stop offset="1" class="t-stop" stop-opacity="0"/></linearGradient>' +
        "</defs>");

      // past shading
      const nf = nowFraction();
      const nowX = nf == null ? null : Math.min(right, Math.max(g.PL, g.PL + (nf + 0.5) * cw));
      if (nowX != null && nowX > g.PL + 1) out.push('<rect class="past" x="' + g.PL + '" y="' + (g.plotTop - 6) + '" width="' + (nowX - g.PL).toFixed(1) + '" height="' + (g.plotBot - g.plotTop + 6) + '"/>');

      // day separators + labels
      const days = [];
      st.forEach((s, i) => { if (i === 0 || dayKey(s.time) !== dayKey(st[i - 1].time)) days.push(i); });
      days.forEach((i, k) => {
        const x = i === 0 ? g.PL : X(i) - cw / 2;
        if (i > 0) out.push('<line class="daysep" x1="' + x.toFixed(1) + '" x2="' + x.toFixed(1) + '" y1="2" y2="' + g.spdY + '"/>');
        const nextX = k + 1 < days.length ? X(days[k + 1]) - cw / 2 : right;
        if (nextX - x > 70) out.push('<text class="daylbl" x="' + (x + (i === 0 ? 0 : 6)).toFixed(1) + '" y="11">' + esc(F.day(st[i].time)) + "</text>");
      });

      // weather icons
      const kI = pickStep([2, 3, 6, 12], 26);
      // group hours into kI-hour windows aligned to local time; show the most significant WW per window
      const h0 = localHour(st[0].time) % kI;
      const wins = [];
      st.forEach((s, i) => {
        const id = Math.floor((i + h0) / kI);
        (wins[id] = wins[id] || []).push(i);
      });
      wins.forEach((ids) => {
        if (!ids || ids.length < Math.ceil(kI / 2) || !ids.some((i) => isNum(st[i].ww))) return;
        let best = ids[0];
        ids.forEach((i) => { if (isNum(st[i].ww) && (!isNum(st[best].ww) || st[i].ww > st[best].ww)) best = i; });
        const mid = ids[Math.floor(ids.length / 2)];
        const w = wx(st[best].ww, st[mid].time);
        const cx = (X(ids[0]) + X(ids[ids.length - 1])) / 2;
        out.push("<g><title>" + esc(F.time(st[ids[0]].time) + "–" + F.time(new Date(Date.parse(st[ids[ids.length - 1]].time) + 3600e3).toISOString()) + " · " + w.label) + "</title>" + iconAt(w.name, cx, 29, 22) + "</g>");
      });

      // cloud strip
      out.push('<text class="gut" x="' + (g.PL - 6) + '" y="51.5" text-anchor="end">Wolken</text>');
      const cstops = [];
      C.forEach((c, i) => {
        if (c == null) return;
        cstops.push('<stop offset="' + ((X(i) - g.PL) / (right - g.PL)).toFixed(4) + '" class="c-stop" stop-opacity="' + (0.05 + 0.85 * Math.min(100, Math.max(0, c)) / 100).toFixed(2) + '"/>');
      });
      out.push('<linearGradient id="cg" gradientUnits="userSpaceOnUse" x1="' + g.PL + '" x2="' + right + '" y1="0" y2="0">' + cstops.join("") + "</linearGradient>");
      out.push('<rect x="' + g.PL + '" y="44" width="' + (right - g.PL) + '" height="8" rx="4" class="c-track"/>');
      if (cstops.length) out.push('<rect x="' + g.PL + '" y="44" width="' + (right - g.PL) + '" height="8" rx="4" fill="url(#cg)"/>');

      // ---- panels (each with its own single y-axis)
      const yScales = {};
      const gridAndTicks = (p, lo, hi, step, fmtTick, baseline, title) => {
        const ys = (v) => p.bot - ((v - lo) / (hi - lo)) * p.h;
        const every = Math.max(1, Math.ceil(18 / ((p.h * step) / (hi - lo))));
        const nT = Math.round((hi - lo) / step);
        for (let k = 0; k <= nT && k < 24; k++) {
          const v = lo + k * step;
          const y = Math.round(ys(v)) + 0.5;
          out.push('<line class="' + (baseline && k === 0 ? "base" : "grid") + '" x1="' + g.PL + '" x2="' + right + '" y1="' + y + '" y2="' + y + '"/>');
          if ((nT - k) % every === 0 && (baseline || k > 0)) out.push('<text class="tick" x="' + (g.PL - 6) + '" y="' + (y + 3.5) + '" text-anchor="end">' + esc(fmtTick(v)) + "</text>");
        }
        if (title) out.push('<text class="ptitle ann-halo" x="' + (right - 4) + '" y="' + (p.top + 11) + '" text-anchor="end">' + title + "</text>");
        return ys;
      };

      // Temperature
      if (g.P.temp) {
        const p = g.P.temp;
        const all = finite(T.concat(mode === "temp" ? TD : []));
        let lo = all.length ? Math.min(...all) : 0, hi = all.length ? Math.max(...all) : 10;
        if (hi - lo < 4) { const c = (hi + lo) / 2; lo = c - 2; hi = c + 2; }
        const step = niceStep(hi - lo, p.h > 90 ? 4 : 2);
        lo = Math.floor((lo - step * 0.15) / step) * step; hi = Math.ceil((hi + step * 0.6) / step) * step;
        const ys = gridAndTicks(p, lo, hi, step, (v) => F.num(v, step < 1 ? 1 : 0) + "°", false, "Temperatur °C");
        yScales.temp = ys;
        const yT = T.map((v) => (v == null ? null : ys(v)));
        const yTD = TD.map((v) => (v == null ? null : ys(v)));
        if (mode === "temp") {
          out.push('<path d="' + areaPath(xs, yT, p.bot) + '" fill="url(#tg)"/>');
          out.push('<path class="td-line" d="' + linePath(xs, yTD) + '"/>');
        }
        out.push('<path class="t-line" d="' + linePath(xs, yT) + '"' + (mode === "temp" ? "" : ' style="stroke-width:1.75"') + "/>");
        let iMin = -1, iMax = -1;
        T.forEach((v, i) => { if (v == null) return; if (iMin < 0 || v < T[iMin]) iMin = i; if (iMax < 0 || v > T[iMax]) iMax = i; });
        const ann = (i, above) => {
          const x = X(i), y = yT[i];
          const anchor = x < g.PL + 18 ? "start" : x > right - 18 ? "end" : "middle";
          out.push('<circle class="dot t" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4"/>');
          out.push('<text class="ann ann-halo" x="' + x.toFixed(1) + '" y="' + (above ? y - 9 : y + 17).toFixed(1) + '" text-anchor="' + anchor + '">' + esc(F.num(T[i], 1) + "°") + "</text>");
        };
        if (iMax < 0) out.push('<text class="noprecip" x="' + ((g.PL + right) / 2) + '" y="' + (p.top + p.h / 2 + 3) + '" text-anchor="middle">Keine Temperaturdaten</text>');
        if (iMax >= 0) ann(iMax, true);
        if (iMin >= 0 && iMin !== iMax && p.h > 60) ann(iMin, false);
      }

      // Precipitation
      if (g.P.precip) {
        const p = g.P.precip;
        const pv = finite(PRC);
        const pmax = pv.length ? Math.max(...pv) : 0;
        const tall = p.h > 80;
        let hi, step;
        if (tall) { step = niceStep(Math.max(pmax * 1.2, 1), 3); hi = Math.max(step, Math.ceil((pmax * 1.2) / step) * step); }
        else { hi = pmax <= 1 ? 1 : pmax <= 2 ? 2 : pmax <= 5 ? 5 : Math.ceil(pmax / 5) * 5; step = hi; }
        const ys = gridAndTicks(p, 0, hi, step, (v) => (v === 0 ? "0" : F.num(v, step < 1 ? 1 : 0)), true, "Niederschlag mm/h");
        yScales.precip = ys;
        const bw = Math.max(2, Math.min(cw * 0.68, 18));
        let any = false;
        PRC.forEach((v, i) => {
          if (v == null || v <= 0) return;
          any = true;
          const h = Math.max(1.5, p.bot - ys(Math.min(v, hi)));
          const x = X(i) - bw / 2, y = p.bot - h, r = Math.min(3, bw / 2, h);
          out.push('<path class="bar' + (mode === "precip" ? "" : " lite") + '" d="M' + x.toFixed(1) + "," + p.bot + "V" + (y + r).toFixed(1) +
            "Q" + x.toFixed(1) + "," + y.toFixed(1) + " " + (x + r).toFixed(1) + "," + y.toFixed(1) + "H" + (x + bw - r).toFixed(1) +
            "Q" + (x + bw).toFixed(1) + "," + y.toFixed(1) + " " + (x + bw).toFixed(1) + "," + (y + r).toFixed(1) + "V" + p.bot + 'Z"/>');
          if (mode === "precip" && ((cw >= 22 && v >= 0.5) || v === pmax)) {
            out.push('<text class="bar-val ann-halo" x="' + X(i).toFixed(1) + '" y="' + (y - 4).toFixed(1) + '" text-anchor="middle">' + esc(F.num(v, 1)) + "</text>");
          }
        });
        if (!any) out.push('<text class="noprecip" x="' + ((g.PL + right) / 2) + '" y="' + (p.top + p.h / 2 + 3) + '" text-anchor="middle">' + (pv.length ? "Kein Niederschlag erwartet" : "Keine Niederschlagsdaten") + "</text>");
      }

      // Wind
      if (g.P.wind) {
        const p = g.P.wind;
        const all = finite(WS.concat(GU));
        const top = all.length ? Math.max(...all) : 20;
        const step = niceStep(top * 1.15, p.h > 90 ? 4 : 2);
        const hi = Math.max(step, Math.ceil((top * 1.15) / step) * step);
        const ys = gridAndTicks(p, 0, hi, step, (v) => F.num(v, 0), true, "Wind &amp; Böen km/h");
        yScales.wind = ys;
        const yW = WS.map((v) => (v == null ? null : ys(v)));
        const yG = GU.map((v) => (v == null ? null : ys(v)));
        out.push('<path class="g-band" d="' + bandPath(xs, yW, yG) + '"/>');
        out.push('<path class="g-line" d="' + linePath(xs, yG) + '"/>');
        out.push('<path class="w-line" d="' + linePath(xs, yW) + '"/>');
        if (!all.length) out.push('<text class="noprecip" x="' + ((g.PL + right) / 2) + '" y="' + (p.top + p.h / 2 + 3) + '" text-anchor="middle">Keine Winddaten</text>');
        let iG = -1;
        GU.forEach((v, i) => { if (v != null && (iG < 0 || v > GU[iG])) iG = i; });
        if (iG >= 0) {
          const x = X(iG), y = yG[iG];
          const anchor = x < g.PL + 40 ? "start" : x > right - 40 ? "end" : "middle";
          out.push('<circle class="dot g" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4"/>');
          out.push('<text class="ann ann-halo" x="' + x.toFixed(1) + '" y="' + (y - 9).toFixed(1) + '" text-anchor="' + anchor + '">Böe ' + esc(F.num(GU[iG], 0)) + " km/h</text>");
        }
      }

      // time axis
      const kT = pickStep([1, 2, 3, 6, 12], 40);
      st.forEach((s, i) => {
        if (localHour(s.time) % kT !== 0) return;
        const x = X(i);
        if (x < g.PL + 12 || x > right - 12) return;
        out.push('<text class="tick" x="' + x.toFixed(1) + '" y="' + g.axisY + '" text-anchor="middle">' + esc(F.time(s.time)) + "</text>");
      });

      // wind arrows row
      out.push('<text class="gut" x="' + (g.PL - 6) + '" y="' + (g.arrowY + 3) + '" text-anchor="end">Wind</text>');
      out.push('<text class="gut" x="' + (g.PL - 6) + '" y="' + g.spdY + '" text-anchor="end">km/h</text>');
      const kW = pickStep([1, 2, 3, 6, 12], 24);
      st.forEach((s, i) => {
        if (localHour(s.time) % kW !== 0) return;
        const x = X(i);
        const spd = WS[i];
        const strong = isNum(GU[i]) && GU[i] >= 50;
        if (WD[i] != null) {
          const sc = 0.85 + (Math.min(isNum(spd) ? spd : 0, 50) / 50) * 0.45;
          out.push('<g transform="translate(' + x.toFixed(1) + "," + g.arrowY + ") rotate(" + ((WD[i] + 180) % 360) + ") scale(" + sc.toFixed(2) + ')">' +
            '<path class="arrow' + (strong ? " strong" : "") + '" d="M0,6V-5.5M-3.4,-2L0,-5.8L3.4,-2"/></g>');
        }
        out.push('<text class="wspd' + (strong ? " strong" : "") + '" x="' + x.toFixed(1) + '" y="' + g.spdY + '" text-anchor="middle">' + esc(isNum(spd) ? F.num(spd, 0) : "–") + "</text>");
      });

      // now marker
      if (nowX != null) {
        const pillW = 38;
        const px = Math.min(Math.max(nowX - pillW / 2, g.PL), right - pillW);
        out.push('<line class="now-line" x1="' + nowX.toFixed(1) + '" x2="' + nowX.toFixed(1) + '" y1="' + (g.plotTop - 6) + '" y2="' + g.plotBot + '"/>');
        out.push('<rect class="now-pill" x="' + px.toFixed(1) + '" y="' + (g.plotTop - 17) + '" width="' + pillW + '" height="14" rx="7"/>');
        out.push('<text class="now-txt" x="' + (px + pillW / 2).toFixed(1) + '" y="' + (g.plotTop - 7) + '" text-anchor="middle">JETZT</text>');
      }

      out.push('<g id="hover"></g>');
      out.push('<rect class="hit" x="' + g.PL + '" y="0" width="' + (right - g.PL) + '" height="' + g.H + '"/>');

      g.yScales = yScales;
      state.geo = g;

      const svg = '<svg viewBox="0 0 ' + W + " " + g.H + '" height="' + g.H + '" aria-hidden="true">' + out.join("") + "</svg>";
      const old = chart.querySelector("svg");
      if (old) old.outerHTML = svg; else chart.insertAdjacentHTML("afterbegin", svg);

      drawLegend();
      if (state.active && state.idx != null) showAt(state.idx);
      DWD.resize();
    }

    function drawLegend() {
      const leg = document.getElementById("leg");
      if (!leg) return;
      const m = state.mode;
      const items = ['<span><i class="sw t"></i>Temperatur</span>'];
      if (m === "temp") items.push('<span><i class="sw td"></i>Taupunkt</span>');
      if (m !== "wind") items.push('<span><i class="sw p"></i>Niederschlag</span>');
      if (m === "wind") items.push('<span><i class="sw w"></i>Wind</span><span><i class="sw g"></i>Böen</span>');
      items.push('<span class="hint">Zeigen oder ← → für Details</span>');
      leg.innerHTML = items.join("");
    }

    // ---------- interaction ----------
    function showAt(i) {
      const g = state.geo, st = state.steps;
      if (!g || !st.length) return;
      i = Math.max(0, Math.min(st.length - 1, i));
      state.idx = i;
      const s = st[i];
      const x = g.X(i);
      const hov = document.getElementById("hover");
      const tip = document.getElementById("tip");
      const chart = document.getElementById("chart");
      if (!hov || !tip || !chart) return;
      const parts = [];
      parts.push('<rect class="hover-col" x="' + (x - g.cw / 2).toFixed(1) + '" y="18" width="' + g.cw.toFixed(1) + '" height="' + (g.H - 18) + '" rx="' + Math.min(4, g.cw / 2).toFixed(1) + '"/>');
      parts.push('<line class="hover-line" x1="' + Math.round(x) + '.5" x2="' + Math.round(x) + '.5" y1="' + g.plotTop + '" y2="' + g.plotBot + '"/>');
      const dot = (cls, scale, v) => { if (scale && isNum(v)) parts.push('<circle class="dot ' + cls + '" cx="' + x.toFixed(1) + '" cy="' + scale(v).toFixed(1) + '" r="4.5"/>'); };
      if (g.yScales.temp) { if (state.mode === "temp") dot("td", g.yScales.temp, s.td2m_c); dot("t", g.yScales.temp, s.t2m_c); }
      if (g.yScales.wind) { dot("g", g.yScales.wind, s.gust_kmh); dot("w", g.yScales.wind, s.wind_speed_kmh); }
      hov.innerHTML = parts.join("");

      const w = wx(s.ww, s.time);
      const dir = F.windDir(s.wind_dir_deg);
      const row = (sw, label, value, extra) => '<tr><td><i class="sw ' + sw + '"></i>' + label + "</td><td>" + esc(value) + (extra ? " <small>" + esc(extra) + "</small>" : "") + "</td></tr>";
      tip.innerHTML =
        '<div class="th"><span class="tt">' + esc(F.dateTime(s.time)) + '</span><span class="tw"><span class="ic-' + w.name + '">' + DWD.icon(w.name, 16) + "</span>" + esc(w.label) + "</span></div>" +
        "<table>" +
          row("t", "Temperatur", F.temp(s.t2m_c, 1)) +
          row("td", "Taupunkt", F.temp(s.td2m_c, 1)) +
          row("p", "Niederschlag", F.mm(s.precip_mm), isNum(s.precip_total_mm) ? "Σ " + F.num(s.precip_total_mm, 1) : "") +
          row("c", "Bewölkung", F.pct(s.cloud_pct)) +
          row("w", "Wind", F.kmh(s.wind_speed_kmh), dir !== "–" ? dir : "") +
          row("g", "Böen", F.kmh(s.gust_kmh)) +
          row("n", "Luftdruck", F.hpa(s.pmsl_hpa)) +
        "</table>";
      tip.classList.add("on");
      const cwid = chart.clientWidth, tw = tip.offsetWidth, th = tip.offsetHeight;
      const px = x * (cwid / g.W);
      let left = px + 14;
      if (left + tw > cwid) left = px - 14 - tw;
      if (left < 0) left = Math.max(0, Math.min(cwid - tw, px - tw / 2));
      const top = Math.max(0, Math.min(g.plotTop + 4, chart.clientHeight - th));
      tip.style.left = left.toFixed(0) + "px";
      tip.style.top = top.toFixed(0) + "px";
    }

    function hide() {
      state.active = false;
      const hov = document.getElementById("hover");
      if (hov) hov.innerHTML = "";
      const tip = document.getElementById("tip");
      if (tip) tip.classList.remove("on");
    }

    function idxFromEvent(e, chart) {
      const g = state.geo;
      const r = chart.getBoundingClientRect();
      const x = (e.clientX - r.left) * (g.W / r.width);
      return Math.floor((x - g.PL) / g.cw);
    }

    function bindChart(chart) {
      const onPoint = (e) => { if (!state.geo) return; state.active = true; showAt(idxFromEvent(e, chart)); };
      chart.addEventListener("pointermove", onPoint);
      chart.addEventListener("pointerdown", onPoint);
      chart.addEventListener("pointerleave", (e) => { if (e.pointerType !== "touch" && document.activeElement !== chart) hide(); });
      chart.addEventListener("focus", () => {
        if (state.idx == null) { const f = nowFraction(); state.idx = f == null ? 0 : Math.max(0, Math.round(f)); }
        state.active = true;
        showAt(state.idx);
      });
      chart.addEventListener("blur", hide);
      chart.addEventListener("keydown", (e) => {
        const n = state.steps.length;
        let i = state.idx == null ? 0 : state.idx;
        if (e.key === "ArrowRight") i++;
        else if (e.key === "ArrowLeft") i--;
        else if (e.key === "Home") i = 0;
        else if (e.key === "End") i = n - 1;
        else if (e.key === "Escape") { hide(); return; }
        else return;
        e.preventDefault();
        state.active = true;
        showAt(Math.max(0, Math.min(n - 1, i)));
      });
    }

    let rafPending = false;
    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(() => {
        if (rafPending) return;
        rafPending = true;
        requestAnimationFrame(() => { rafPending = false; if (state.data) draw(false); });
      }).observe(app);
    } else {
      window.addEventListener("resize", () => state.data && draw(false));
    }

    DWD.onData((data) => {
      try { render(data || {}); }
      catch (e) {
        app.innerHTML = '<div class="dwd-error">Darstellung fehlgeschlagen: ' + esc(e && e.message) + "</div>";
        console.warn(e);
      }
    });
  })();
  </script>
</body>
</html>
